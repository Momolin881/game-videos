<title>2026河濱NBA季後賽</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --black: #0a0a0c;
    --black-2: #15161a;
    --on-black: #f5f6f7;
    --on-black-dim: #9ba1aa;
    --on-black-line: rgba(255,255,255,0.14);

    --bg: #eef0f3;
    --surface: #ffffff;
    --line: rgba(10,12,16,0.09);
    --line-strong: rgba(10,12,16,0.16);
    --text: #121316;
    --text-dim: #585e66;
    --text-faint: #8a8f98;

    --red: #e2202c;
    --red-dim: #a8141e;
    --red-soft: rgba(226,32,44,0.14);
    --blue: #1a4fb4;
    --blue-dim: #123a87;
    --blue-soft: rgba(26,79,180,0.12);
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    min-height: 100vh;
  }

  a{ color: inherit; }

  /* ================= HERO / BLACK BAND ================= */
  .hero{
    background: var(--black);
    color: var(--on-black);
    position: relative;
    overflow: hidden;
  }
  .hero-art{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 35%;
    filter: invert(1);
    opacity: 0.25;
    pointer-events: none;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 620px 320px at 14% 0%, rgba(226,32,44,0.30), transparent 60%),
      radial-gradient(ellipse 620px 360px at 86% 10%, rgba(26,79,180,0.26), transparent 60%),
      linear-gradient(to bottom, rgba(10,10,12,0.35), var(--black) 92%);
    pointer-events:none;
  }
  .hero::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:120px;
    background: repeating-linear-gradient(90deg, transparent 0 109px, rgba(255,255,255,0.045) 109px 110px);
    mask-image: linear-gradient(to top, black, transparent);
    pointer-events:none;
  }

  .navbar{
    position: relative;
    z-index: 1;
    max-width: 1040px;
    margin: 0 auto;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--on-black-line);
  }
  .wordmark{
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: 'Teko', sans-serif;
    font-weight: 700;
    letter-spacing: 0.04em;
    font-size: 22px;
  }
  .wordmark .dot{ color: var(--red); }
  .navbar .season{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--on-black-dim);
  }

  .hero-body{
    position: relative;
    z-index: 1;
    max-width: 1040px;
    margin: 0 auto;
    padding: 56px 24px 64px;
  }

  .eyebrow{
    font-family: 'Teko', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--red);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .eyebrow::before{ content:""; width:26px; height:2px; background: var(--red-dim); }

  h1{
    font-weight: 900;
    font-size: clamp(34px, 6vw, 56px);
    line-height: 1.06;
    letter-spacing: -0.01em;
    margin: 0 0 18px;
    text-wrap: balance;
    color: var(--on-black);
  }
  h1 .accent-char{ color: var(--red); }

  .tagline{
    font-family: 'Teko', sans-serif;
    font-weight: 500;
    font-style: italic;
    font-size: 18px;
    letter-spacing: 0.04em;
    color: var(--blue);
    margin: 0 0 22px;
    padding-left: 14px;

  }

  .lede{
    font-size: 15.5px;

  }
  .lede a{ color: var(--on-black); border-bottom: 1px solid var(--on-black-dim); text-decoration: none; }

    max-width: 1040px;

  #status{

  .spin{

  .setup-note b{ color: var(--text); }
  .setup-note a{ color: var(--red); }

  /* ---- day groups ---- */
  .day-group{ margin-bottom: 40px; }
  .day-overline{
    font-family: 'Teko', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 4px;
  }
  .day-group{ scroll-margin-top: 20px; }
  .day-head{
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 10px;
    padding-bottom: 10px;

  .day-num{

    font-weight: 600;

  .day-count{

  .roster-x{

    flex-wrap: wrap;

  .card .scrim{
    position: absolute; inset: 0;

  .card .play{
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%) scale(0.9);

    border-radius: 50%;

  .card .tag{
    position: absolute;
    top: 8px; left: 8px;
    font-family: 'Teko', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.06em;

    border-radius: 4px;

  .card .info{

    left: 10px; right: 10px; bottom: 8px;

    font-weight: 700;
    font-size: 11.5px;
    color: #fff;

    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

  /* ---- player modal ---- */
  .modal{
    position: fixed; inset: 0;
    background: rgba(5,5,7,0.9);
    display: none;
    align-items: center;
    justify-content: center;

  .modal-box{
    max-width: min(880px, 100%);

    max-height: 92vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;

  .modal-head{
    display: flex;
    align-items: center;
    justify-content: space-between;

  .modal-title{ font-weight: 700; font-size: 15px; }
  .modal-sub{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--on-black-dim);
    margin-top: 2px;

  .modal-close{
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--black-2);
    border: 1px solid var(--on-black-line);
    color: var(--on-black);
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;

  .modal-close:hover{ border-color: var(--red); color: var(--red); }

  .modal-video-wrap{
    background: #000;
    border-radius: 10px;
    overflow: hidden;

  }
  .modal-video-wrap video{

  #goalsPanel{ color: var(--on-black); }

  .modal-panel-label,
  .goals-label{

    font-size: 12px;
    letter-spacing: 0.18em;

  }
  .goals-chips{ display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; min-height: 26px; }
  .goal-chip{
    display: inline-flex;
    align-items: center;
    gap: 2px;

    color: #ffd9db;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 4px 4px 11px;
    border-radius: 999px;
    border: 1px solid rgba(226,32,44,0.4);
  }
  .goal-time{ cursor: pointer; white-space: nowrap; }
  .goal-time:hover{ text-decoration: underline; }
  .goal-scorer-input{
    width: 64px;
    border: 0;
    border-left: 1px solid rgba(226,32,44,0.4);
    background: transparent;
    color: #fff;
    font-family: 'Noto Sans TC', sans-serif;

    font-weight: 500;
    padding: 0 4px 0 8px;
    margin-left: 4px;
  }
  .goal-scorer-input::placeholder{ color: rgba(255,217,219,0.55); }
  .goal-scorer-input:focus{ outline: none; }
  .goal-x{
    border: 0;
    background: transparent;
    color: inherit;
    cursor: pointer;
    width: 15px; height: 15px;
    border-radius: 50%;
    font-size: 11px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .goal-x:hover{ background: rgba(0,0,0,0.35); }
  .goals-add{ display: flex; flex-wrap: wrap; gap: 8px; }
  .goals-input{
    width: 84px;
    border: 1px solid var(--on-black-line);
    background: var(--black-2);
    color: var(--on-black);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
  }
  .goals-input:focus{ outline: none; border-color: var(--red); }
  .goals-add-btn{
    border: 1px solid var(--red-dim);
    background: transparent;
    color: var(--red);
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 12.5px;
    font-weight: 600;

  .goals-add-btn:hover{ background: var(--red); color: #fff; }
  .quickmark-btn{

  .goals-hint{

  .meta-row{

    align-items: center;

  @media (max-width: 560px){
    .hero-body{ padding: 44px 18px 48px; }

<script>
(function(){
  // ---- 設定：資料夾、API Key、球員/進球資料後端（Google Apps Script） ----
  var FOLDER_ID = '12qlNZh5gT0dlB01MbUw-SUczqfC0ycKQ';
  var API_KEY = 'AIzaSyB-hXDy6Nekjga9l8qMMHCVhgoZbQOQASE';
  var SHEETS_API = 'https://script.google.com/macros/s/AKfycby-dEH3QiDtJrfeX1SonudWSk0_EegyH1uedk5J1FeWPYGeMuumud8hnefUjp-AK6SZ/exec';

  function apiGet(action){
    return fetch(SHEETS_API + '?action=' + action).then(function(r){ return r.json(); });
  }
  function apiPost(action, body){
    var payload = Object.assign({ action: action }, body);
    return fetch(SHEETS_API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function(r){ return r.json(); });
  }

  var statusEl = document.getElementById('status');
  var contentEl = document.getElementById('content');
  var modal = document.getElementById('modal');
  var modalVideo = document.getElementById('modalVideo');
  var modalTitle = document.getElementById('modalTitle');
  var modalSub = document.getElementById('modalSub');
  var rosterPanel = document.getElementById('rosterPanel');
  var goalsPanel = document.getElementById('goalsPanel');

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function fmtDuration(ms){
    if(!ms) return '';
    var s = Math.round(ms/1000);
    var m = Math.floor(s/60);
    var r = s%60;
    return m + ':' + (r<10?'0':'') + r;
  }

  function fmtSeconds(t){
    t = Math.max(0, Math.round(t));
    var m = Math.floor(t/60), s = t%60;
    return m + ':' + (s<10?'0':'') + s;
  }

  function parseTimeInput(str){
    str = (str || '').trim();
    if(!str) return null;
    if(/^\d+:\d{1,2}$/.test(str)){
      var parts = str.split(':');
      var secs = parseInt(parts[1], 10);
      if(secs > 59) return null;
      return parseInt(parts[0], 10) * 60 + secs;
    }
    if(/^\d+$/.test(str)) return parseInt(str, 10);
    return null;
  }

  // 優先從檔名解析實際錄製時間（手機相機命名格式 YYYYMMDD_HHMMSS），
  // 這樣分組才會照「比賽當天」而不是「雲端硬碟上傳完成的時間」。
  // 檔名格式不符合時，退回用 Drive 的建立時間。
  function recordedTime(file){
    var m = /^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/.exec(file.name);
    if(m){
      return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime();
    }
    return new Date(file.createdTime).getTime();
  }

  function dayKey(ts){
    var d = new Date(ts);
    return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  }

  function dayLabel(ts){
    var d = new Date(ts);
    var md = (d.getMonth()+1) + '.' + d.getDate();
    var weekday = new Intl.DateTimeFormat('zh-TW', { weekday: 'short' }).format(d);
    return { num: md, label: d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 ' + weekday };
  }

  function showSetupNote(message){
    statusEl.classList.add('hidden');
    contentEl.innerHTML =
      '<div class="setup-note">' +
        '<b>影片清單還沒連上即時資料。</b><br>' +
        escapeHtml(message) + '<br><br>' +
        '在設定完成前，可以先點下方「在雲端硬碟開啟原始資料夾」直接看影片。' +
      '</div>';
  }

  // ---- 球員名單（每支影片一份，存在 Google 試算表的 players 分頁） ----
  function setupRoster(fileId){
    rosterPanel.innerHTML =
      '<div class="modal-panel-label">本場參與球員</div>' +
      '<div class="roster"><span class="roster-chips"></span>' +
      '<input class="roster-input" placeholder="+ 新增球員，按 Enter"></div>';
    rosterPanel.hidden = false;

    var chipsEl = rosterPanel.querySelector('.roster-chips');
    var inputEl = rosterPanel.querySelector('.roster-input');
    var names = [];

    function render(){
      chipsEl.innerHTML = names.map(function(n){
        return '<span class="roster-chip">' + escapeHtml(n) +
          '<button type="button" class="roster-x" data-n="' + escapeHtml(n) + '">×</button></span>';
      }).join('');
    }

    apiGet('players').then(function(res){
      names = (res.ok && res.players && res.players[fileId]) ? res.players[fileId] : [];
      render();
    }).catch(function(){});

    chipsEl.addEventListener('click', function(e){
      var btn = e.target.closest('.roster-x');
      if(!btn) return;
      var removed = btn.getAttribute('data-n');
      names = names.filter(function(n){ return n !== removed; });
      render();
      apiPost('removePlayer', { fileId: fileId, name: removed }).catch(function(){});
    });

    inputEl.addEventListener('keydown', function(e){
      if(e.key !== 'Enter') return;
      var v = inputEl.value.trim();
      if(!v) return;
      if(names.indexOf(v) === -1){
        names.push(v);
        render();
        apiPost('addPlayer', { fileId: fileId, name: v }).catch(function(){});
      }
      inputEl.value = '';
    });
  }

  // 快捷鍵抓進球時的「目前正在開著的進球控制器」——同一時間只會有一支影片在播放
  var activeGoalsController = null;
  var QUICK_MARK_BACKTRACK_SECONDS = 3;

  function normalizeMark(m){
    return (typeof m === 'number') ? { t: m, scorer: '' } : { t: m.t, scorer: m.scorer || '' };
  }

  // ---- 進球時間軸（每支影片一份，存在 Google 試算表的 goals 分頁） ----
  function setupGoals(fileId, videoEl){
    goalsPanel.innerHTML =
      '<div class="modal-panel-label">進球時間軸</div>' +
      '<div class="goals-hint">到進球的當下點上面這顆按鈕，或手動輸入，並打上是誰進的。</div>' +
      '<div class="goals-chips"></div>' +
      '<div class="goals-add">' +
        '<button type="button" class="quickmark-btn" title="自動往前抓 ' + QUICK_MARK_BACKTRACK_SECONDS + ' 秒">⚽ 進球</button>' +
        '<input class="goals-input" placeholder="mm:ss" />' +
        '<button type="button" class="goals-add-btn">+ 手動輸入時間</button>' +
      '</div>';
    goalsPanel.hidden = false;

    var chipsEl = goalsPanel.querySelector('.goals-chips');
    var inputEl = goalsPanel.querySelector('.goals-input');
    var addBtn = goalsPanel.querySelector('.goals-add-btn');
    var quickBtn = goalsPanel.querySelector('.quickmark-btn');
    var marks = [];

    function render(){
      chipsEl.innerHTML = marks.map(function(m){
        return '<span class="goal-chip">' +
          '<span class="goal-time" data-t="' + m.t + '">⚽ ' + fmtSeconds(m.t) + '</span>' +
          '<input class="goal-scorer-input" data-t="' + m.t + '" placeholder="是誰？" value="' + escapeHtml(m.scorer) + '">' +
          '<button type="button" class="goal-x" data-t="' + m.t + '">×</button>' +
        '</span>';
      }).join('');
    }

    function addMark(rawT){
      var t = Math.max(0, Math.round(rawT));
      if(marks.some(function(m){ return m.t === t; })) return null;
      var mark = { t: t, scorer: '' };
      marks.push(mark);
      marks.sort(function(a,b){ return a.t - b.t; });
      render();
      apiPost('addGoal', { fileId: fileId, t: t, scorer: '' }).catch(function(){});
      requestAnimationFrame(function(){
        var input = chipsEl.querySelector('.goal-scorer-input[data-t="' + mark.t + '"]');
        if(input) input.focus();
      });
      return mark;
    }

    apiGet('goals').then(function(res){
      var list = (res.ok && res.goals && res.goals[fileId]) ? res.goals[fileId] : [];
      marks = list.map(normalizeMark).sort(function(a,b){ return a.t-b.t; });
      render();
    }).catch(function(){});

    chipsEl.addEventListener('click', function(e){
      var xBtn = e.target.closest('.goal-x');
      if(xBtn){
        var rm = parseFloat(xBtn.getAttribute('data-t'));
        marks = marks.filter(function(m){ return m.t !== rm; });
        render();
        apiPost('removeGoal', { fileId: fileId, t: rm }).catch(function(){});
        return;
      }
      var timeEl = e.target.closest('.goal-time');
      if(timeEl){
        videoEl.currentTime = parseFloat(timeEl.getAttribute('data-t'));
        videoEl.play().catch(function(){});
      }
    });

    chipsEl.addEventListener('change', function(e){
      if(!e.target.classList.contains('goal-scorer-input')) return;
      var t = parseFloat(e.target.getAttribute('data-t'));
      var m = marks.filter(function(mm){ return mm.t === t; })[0];
      if(m){
        m.scorer = e.target.value.trim();
        apiPost('updateGoalScorer', { fileId: fileId, t: t, scorer: m.scorer }).catch(function(){});
      }
    });

    chipsEl.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && e.target.classList.contains('goal-scorer-input')) e.target.blur();
    });

    function addFromInput(){
      var t = parseTimeInput(inputEl.value);
      if(t === null){ inputEl.focus(); return; }
      addMark(t);
      inputEl.value = '';
    }

    addBtn.addEventListener('click', addFromInput);
    inputEl.addEventListener('keydown', function(e){ if(e.key === 'Enter') addFromInput(); });

    function quickMark(){
      addMark(videoEl.currentTime - QUICK_MARK_BACKTRACK_SECONDS);
    }

    quickBtn.addEventListener('click', quickMark);
    activeGoalsController = { quickMark: quickMark };
  }

  function openPlayer(file){
    if(file.__demo){
      modalVideo.removeAttribute('src');
      modalVideo.poster = '';
      modalVideo.style.aspectRatio = (file.videoMediaMetadata.width) + ' / ' + (file.videoMediaMetadata.height);
      modalVideo.style.width = (file.videoMediaMetadata.height > file.videoMediaMetadata.width ? '320px' : '100%');
      modalVideo.style.background = 'repeating-linear-gradient(135deg, #1a1b1f, #1a1b1f 10px, #121317 10px, #121317 20px)';
    } else {
      var src = 'https://www.googleapis.com/drive/v3/files/' + file.id + '?alt=media&key=' + API_KEY;
      modalVideo.src = src;
    }
    modalTitle.textContent = file.name + (file.__demo ? '（示範・尚未串接真實影片）' : '');
    var meta = [];
    meta.push(dayLabel(file.__ts).label);
    if(file.videoMediaMetadata){
      var w = file.videoMediaMetadata.width, h = file.videoMediaMetadata.height;
      if(w && h) meta.push(w+'×'+h+'・'+(h>w?'直式':'橫式'));
      if(file.videoMediaMetadata.durationMillis) meta.push(fmtDuration(file.videoMediaMetadata.durationMillis));
    }
    modalSub.textContent = meta.join('・');
    modal.classList.add('open');
    modalVideo.play().catch(function(){});

    rosterPanel.hidden = true;
    rosterPanel.innerHTML = '';
    goalsPanel.hidden = true;
    goalsPanel.innerHTML = '';
    setupRoster(file.id);
    setupGoals(file.id, modalVideo);
  }

  function closePlayer(){
    modal.classList.remove('open');
    modalVideo.pause();
    modalVideo.removeAttribute('src');
    modalVideo.load();
    activeGoalsController = null;
    refreshPlayerTags();
  }

  // 把球員名單蓋到縮圖上——一次讀整個 players 集合（而不是每張卡片各讀一次），
  // 球友光看縮圖就能判斷這段有沒有自己在場上。
  function refreshPlayerTags(){
    apiGet('players').then(function(res){
      if(!res.ok) return;
      var map = res.players || {};
      contentEl.querySelectorAll('.card').forEach(function(card){
        var names = map[card.getAttribute('data-fileid')];
        var tag = card.querySelector('.players-tag');
        if(tag) tag.textContent = (names && names.length) ? names.join('、') : '';
      });
    }).catch(function(){});
  }

  document.getElementById('modalClose').addEventListener('click', closePlayer);
  modal.addEventListener('click', function(e){ if(e.target === modal) closePlayer(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ closePlayer(); return; }
    if(!modal.classList.contains('open') || !activeGoalsController) return;
    if(e.key.toLowerCase() !== 'g') return;
    var active = document.activeElement;
    if(active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    activeGoalsController.quickMark();
  });

  function renderGroups(files){
    statusEl.classList.add('hidden');

    if(!files.length){
      contentEl.innerHTML = '<div class="setup-note">資料夾裡還沒有影片，等球友上傳後重新整理這頁就會出現。</div>';
      return;
    }

    var groups = {};
    files.forEach(function(f){
      var k = dayKey(f.__ts);
      if(!groups[k]) groups[k] = [];
      groups[k].push(f);
    });
    var order = Object.keys(groups).sort(function(a, b){
      return groups[b][0].__ts - groups[a][0].__ts;
    });

    var latestTime = Math.max.apply(null, files.map(function(f){ return f.__ts; }));
    var EXPANDED_BY_DEFAULT = 2;

    var jumpsHtml = '';
    if(order.length > 1){
      jumpsHtml += '<div class="day-jumps">';
      order.forEach(function(k, gi){
        var jdl = dayLabel(groups[k][0].__ts);
        jumpsHtml += '<button type="button" class="day-jump' + (gi === 0 ? ' is-latest' : '') + '" data-daykey="' + escapeHtml(k) + '">' + jdl.num + '</button>';
      });
      jumpsHtml += '</div>';
    }

    var html = '';
    order.forEach(function(k, gi){
      var list = groups[k].slice().sort(function(a, b){ return b.__ts - a.__ts; });
      var dl = dayLabel(list[0].__ts);
      var gameNo = String(order.length - gi).padStart(2, '0');
      var collapsed = gi >= EXPANDED_BY_DEFAULT;
      html += '<section class="day-group' + (collapsed ? ' collapsed' : '') + '" id="day-' + escapeHtml(k) + '">';
      html += '<div class="day-overline">Game Day ' + gameNo + '</div>';
      html += '<div class="day-head"><span class="day-num">' + dl.num + '</span><span class="day-label">' + dl.label + '</span><span class="day-count">' + list.length + ' 支影片</span><span class="day-toggle">▾</span></div>';
      html += '<div class="card-grid">';
      list.forEach(function(f, i){
        var vmm = f.videoMediaMetadata || {};
        var w = vmm.width || 16, h = vmm.height || 9;
        var ratio = w / h;
        var widthPx = Math.round(176 * ratio);
        var isLatest = f.__ts === latestTime;
        var dur = fmtDuration(vmm.durationMillis);
        var thumb = f.thumbnailLink || '';
        html += '<div class="card" style="width:' + widthPx + 'px" data-idx="' + f.__idx + '" data-fileid="' + escapeHtml(f.id) + '">';
        if(thumb){
          html += '<img src="' + thumb + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
        }
        html += '<div class="scrim"></div>';
        if(isLatest){ html += '<span class="tag">最新</span>'; }
        html += '<div class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>';
        html += '<div class="info"><span class="players-tag"></span><span class="dur">' + dur + '</span></div>';
        html += '</div>';
      });
      html += '</div></section>';
    });

    contentEl.innerHTML = jumpsHtml + html;

    contentEl.querySelectorAll('.card').forEach(function(el){
      el.addEventListener('click', function(){
        openPlayer(files[parseInt(el.getAttribute('data-idx'), 10)]);
      });
    });

    contentEl.querySelectorAll('.day-head').forEach(function(el){
      el.addEventListener('click', function(){
        el.closest('.day-group').classList.toggle('collapsed');
      });
    });

    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    contentEl.querySelectorAll('.day-jump').forEach(function(el){
      el.addEventListener('click', function(){
        var section = document.getElementById('day-' + el.getAttribute('data-daykey'));
        if(!section) return;
        section.classList.remove('collapsed');
        section.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
      });
    });

    refreshPlayerTags();
  }

  // 示範資料：直式先略過，等接上真實資料、系統偵測到直式影片時會自動以正確比例出現
  var MOCK_FILES = [
    { id:'demo1', name:'20261026_184248.mp4', createdTime:'2026-10-26T18:42:48+08:00', videoMediaMetadata:{ width:1920, height:1080, durationMillis:125000 }, __demo:true },
    { id:'demo2', name:'20261026_185803.mp4', createdTime:'2026-10-26T18:58:03+08:00', videoMediaMetadata:{ width:1920, height:1080, durationMillis:88000 }, __demo:true },
    { id:'demo3', name:'20261031_183022.mp4', createdTime:'2026-10-31T18:30:22+08:00', videoMediaMetadata:{ width:1920, height:1080, durationMillis:210000 }, __demo:true },
    { id:'demo4', name:'20261101_180202.mp4', createdTime:'2026-11-01T18:02:02+08:00', videoMediaMetadata:{ width:1920, height:1080, durationMillis:95000 }, __demo:true },
    { id:'demo5', name:'20261101_185923.mp4', createdTime:'2026-11-01T18:59:23+08:00', videoMediaMetadata:{ width:1080, height:1920, durationMillis:60000 }, __demo:true },
    { id:'demo6', name:'20261101_190501.mp4', createdTime:'2026-11-01T19:05:01+08:00', videoMediaMetadata:{ width:1920, height:1080, durationMillis:143000 }, __demo:true }
  ];

  if(!API_KEY || API_KEY === 'YOUR_API_KEY_HERE'){
    MOCK_FILES.forEach(function(f, i){ f.__idx = i; f.__ts = recordedTime(f); });
    renderGroups(MOCK_FILES);
    contentEl.insertAdjacentHTML('afterbegin', '<div class="setup-note" style="margin-bottom:26px"><b>目前顯示示範版面。</b>管理員貼上 Drive API Key 後，會自動換成即時賽事資料。</div>');
    return;
  }

  var fields = 'files(id,name,createdTime,mimeType,videoMediaMetadata,thumbnailLink)';
  var q = encodeURIComponent("'" + FOLDER_ID + "' in parents and mimeType contains 'video/' and trashed = false");
  var url = 'https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=' + encodeURIComponent(fields) + '&orderBy=createdTime desc&pageSize=200&key=' + API_KEY;

  fetch(url)
    .then(function(r){
      if(!r.ok) return r.json().then(function(j){ throw new Error((j.error && j.error.message) || ('HTTP ' + r.status)); });
      return r.json();
    })
    .then(function(data){
      var files = data.files || [];
      files.forEach(function(f, i){ f.__idx = i; f.__ts = recordedTime(f); });
      renderGroups(files);
    })
    .catch(function(err){
      // 讀不到即時資料（例如在 Artifact 預覽環境裡無法對外連線）時，
      // 退回顯示示範版面，而不是整頁空白——球員名單/進球標記功能仍可照常測試。
      MOCK_FILES.forEach(function(f, i){ f.__idx = i; f.__ts = recordedTime(f); });
      renderGroups(MOCK_FILES);
      contentEl.insertAdjacentHTML('afterbegin', '<div class="setup-note" style="margin-bottom:26px"><b>目前顯示示範版面。</b>即時資料讀取失敗（' + escapeHtml(err.message) + '），這通常是預覽環境本身的連線限制，正式網站上不會有這個狀況。</div>');
    });
})();
</script>
